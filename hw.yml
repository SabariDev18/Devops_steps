apiVersion: v1
kind: Pod
metadata:
  name: hw
spec:
  nodeName: ip-172-31-6-124.ap-south-1.compute.internal
  containers:
   - name: secm
     image: alpine
     command: ["sleep","1000"]
     env:
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
            name: secretm
            key: MYSQL_USER
      - name: hw
        valueFrom:
          configMapKeyRef:
            name: conf
            key: hw
