apiVersion: v1
kind: Service
metadata:
  name: alpine
spec:
  clusterIP: None
  selector:
    app: alpine
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alpine
spec:
  serviceName: alpine
  replicas: 2
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
      - name: alpine
        image: alpine
        command:
        - sh
        - -c
        - |
          echo "Pod: $(hostname)" > /data/info.txt
          sleep 3600
        volumeMounts:
        - name: data
          mountPath: /data

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
