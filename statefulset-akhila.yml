apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: al
spec:
  serviceName: service-akhila
  replicas: 2

  selector:
    matchLabels:
      app: alpine

  template:
    metadata:
      labels:
        app: alpine

    spec:
      nodeName: ip-172-31-6-124.ap-south-1.compute.internal

      containers:
      - name: alpine
        image: alpine
        command: ["sleep","1000"]

        volumeMounts:
        - name: data
          mountPath: /data

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
